<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Strength Checker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="header">
            <h2>Password Strength Checker</h2>
            <button id="infoBtn" class="info-btn" aria-label="Password strength info">i</button>
        </div>

        <input type="password" id="password" placeholder="Type a password">
        <div id="strength" class="strength">Strength: —</div>

        <div id="infoPanel" class="info-panel" aria-live="polite">
            <p>Strength rules:</p>
            <ul>
                <li>Length greater than 6 characters</li>
                <li>Includes an uppercase letter</li>
                <li>Includes a number</li>
                <li>Includes a symbol</li>
            </ul>
            <p>Weak: 0-1 rules • Medium: 2 rules • Strong: 3-4 rules</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
